name: I22 WAXS DAWN cross-check
description: >-
  Test-only I22 WAXS pipeline intended to match the DAWN processing record as
  closely as the current MoDaCor modules allow. This deliberately excludes the
  MoDaCor operational-pipeline extras: threshold raw-count masks, background
  subtraction, transmission normalization, and detector-efficiency correction.
steps:
  PD_sample:
    module: AppendProcessingData
    short_title: Load WAXS sample
    requires_steps: []
    configuration:
      processing_key: sample
      databundle_output_key: signal
      signal_location: sample::/entry1/Pilatus2M_WAXS/data
      units_override: count
      rank_of_data: 2

  PD_static_signal:
    module: AppendProcessingData
    short_title: Load WAXS calibration shape
    requires_steps: []
    configuration:
      processing_key: static
      databundle_output_key: signal
      signal_location: waxs_calibration::/entry1/calibration_data/data
      units_override: count
      rank_of_data: 2

  PD_static_mask:
    module: AppendProcessingData
    short_title: Load WAXS mask
    requires_steps: []
    configuration:
      processing_key: static
      databundle_output_key: mask
      signal_location: waxs_mask::/entry/mask/mask
      units_override: dimensionless
      rank_of_data: 2

  PU_sample:
    module: PoissonUncertainties
    short_title: Set Poisson error
    requires_steps: [PD_sample]
    configuration:
      with_processing_keys: [sample]

  BS_sample:
    module: Divide
    short_title: Channel-average bsdiode normalization
    requires_steps: [PU_sample]
    configuration:
      # DAWN Channel Average over /entry1/bsdiodes/data, channelIndex=1,
      # mathematicalOperator=DIVIDE.
      divisor_source: sample::/modacor/normalization/bsdiodes_channel_1_mean
      divisor_units_source: sample::/modacor/normalization/bsdiodes_channel_1_mean@units
      divisor_uncertainties_sources:
        bsdiodes_STD: sample::/modacor/normalization/bsdiodes_channel_1_std
      with_processing_keys: [sample]

  TI_sample:
    module: Divide
    short_title: WAXS count-time normalization
    requires_steps: [BS_sample]
    configuration:
      divisor_source: sample::/modacor/normalization/waxs_count_time
      divisor_units_source: sample::/modacor/normalization/waxs_count_time@units
      with_processing_keys: [sample]

  FA_sample:
    module: ReduceDimensionality
    short_title: Average fastest dimension
    requires_steps: [TI_sample]
    configuration:
      axes: [0, 1]
      use_weights: true
      nan_policy: propagate
      reduction: mean
      with_processing_keys: [sample]

  PC_static:
    module: PixelCoordinates3D
    short_title: WAXS pixel coordinates
    requires_steps: [PD_static_signal]
    configuration:
      with_processing_keys: [static]
      detector_frame:
        type: nexus
        source: waxs_calibration
        detector_path: /entry1/instrument/detector
        module_origin: first_pixel_center

  GX_static:
    module: XSGeometryFromPixelCoordinates
    short_title: WAXS scattering geometry
    requires_steps: [PC_static]
    configuration:
      with_processing_keys: [static]
      detector_frame:
        type: nexus
        source: waxs_calibration
        detector_path: /entry1/instrument/detector
        module_origin: first_pixel_center
      sample_z_override:
        value: 0.0
        units: mm
      wavelength_source: waxs_calibration::/entry1/calibration_sample/beam/incident_wavelength
      wavelength_units_source: waxs_calibration::/entry1/calibration_sample/beam/incident_wavelength@units

  IP_static:
    module: IndexPixels
    short_title: Index WAXS pixels
    requires_steps: [GX_static]
    configuration:
      averaging_direction: azimuthal
      q_min: 0.44241476418082226
      q_max: 5.471698841709772
      q_limits_unit: 1/angstrom
      bin_type: linear
      psi_min: -180.0
      psi_max: 180.0
      psi_limits_unit: degree
      n_bins: 1502
      with_processing_keys: [static]

  CP_static_sample_maps:
    module: CopyDataBundleKeys
    short_title: Attach WAXS mask and geometry
    requires_steps: [FA_sample, IP_static, PD_static_mask]
    configuration:
      with_processing_keys: [sample, static]
      data_keys: [mask, Q, Psi, TwoTheta, CosAlpha, Omega, pixel_index]
      copy: false

  MASK_instrument_dilate:
    module: DilateMask
    short_title: DAWN mask dilation
    requires_steps: [CP_static_sample_maps]
    configuration:
      # DAWN Dilate Mask: numberOfPixelsToDilate=1.
      with_processing_keys: [sample]
      source_mask_key: mask
      target_mask_key: mask
      radius: 1
      footprint_shape: square

  PO:
    module: PolarizationCorrection
    short_title: DAWN polarization correction
    requires_steps: [MASK_instrument_dilate]
    configuration:
      # DAWN Powder Diffraction Intensity Corrections:
      # applyPolarisationCorrection=true, polarisationFactor=0.9,
      # polarisationAngularOffset=0.0.
      with_processing_keys: [sample]
      mode: linear_fraction
      polarization_factor: 0.9
      polarization_angular_offset: 0.0
      polarization_angular_offset_units: degree

  SP:
    module: SolidAngleCorrection
    short_title: Solid-angle correction
    requires_steps: [PO]
    configuration:
      with_processing_keys: [sample]

  AL:
    module: AttenuatorPlateCorrection
    short_title: DAWN aluminium attenuator correction
    requires_steps: [SP]
    configuration:
      # DAWN Attenuation correction: chemicalComposition=Al, density=2.699,
      # attenuationDistance=0.1, manualEnergyValueUsed=false. Empirically, the
      # DAWN operation applies the Al transmission factor, not its inverse.
      with_processing_keys: [sample]
      material: Al
      density: 2.699
      density_units: g/cm^3
      thickness: 0.1
      thickness_units: cm
      wavelength_source: waxs_calibration::/entry1/calibration_sample/beam/incident_wavelength
      wavelength_units_source: waxs_calibration::/entry1/calibration_sample/beam/incident_wavelength@units
      normalize_to_normal_incidence: false
      apply_as: multiply

  AV:
    module: IndexedAverager
    short_title: WAXS azimuthal integration
    requires_steps: [AL]
    configuration:
      averaging_direction: azimuthal
      use_signal_weights: true
      use_signal_uncertainty_weights: false
      uncertainty_weight_key: null
      with_processing_keys: [sample]

  AU:
    module: Multiply
    short_title: DAWN absolute intensity scalar
    requires_steps: [AV]
    configuration:
      # DAWN Multiply by Scalar: 3.8e-15. The preprocessed file stores the
      # same provisional scalar and units under /modacor/calibration.
      multiplier_source: sample::/modacor/calibration/absolute_intensity_factor
      multiplier_units_source: sample::/modacor/calibration/absolute_intensity_factor@units
      with_processing_keys: [sample]
